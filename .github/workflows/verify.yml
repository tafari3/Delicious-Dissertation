name: verify
on:
  pull_request:
  push:
    branches: [main, phase-1/foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.8.17
      - name: Generate lock and verify
        run: |
          uv lock
          uv sync --extra dev
          uv run alembic upgrade head
          make verify
