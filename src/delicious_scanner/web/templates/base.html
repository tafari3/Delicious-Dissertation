<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Delicious Security{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static',path='/app.css') }}">
</head>
<body class="app-body">
<div class="shell">
  <aside class="sidebar">
    <div class="brand app-brand">
      <div class="brand-mark shield-mark">D</div>
      <div><strong>Delicious Security</strong><span>API Security & Assurance</span></div>
    </div>
    <nav>
      <a class="{{ 'active' if page=='dashboard' else '' }}" href="/"><span>Overview</span></a>
      <a class="{{ 'active' if page=='projects' else '' }}" href="/projects"><span>Systems</span></a>
      <a class="{{ 'active' if page=='scans' else '' }}" href="/"><span>Assessments</span></a>
      <a href="/docs"><span>API Reference</span></a>
    </nav>
    <div class="sidebar-note">
      <span class="status-dot"></span>
      <div><strong>Controlled assessment mode</strong><small>Exact-host scope · bounded requests</small></div>
    </div>
  </aside>

  <main class="app-main">
    <header class="topbar">
      <div>
        <p class="eyebrow">SECURITY OPERATIONS</p>
        <h1>{% block heading %}Security Overview{% endblock %}</h1>
      </div>
      <div class="top-actions">
        <span class="pill">Scanner v0.2</span>
        <span class="pill success">Protected</span>
        <form method="post" action="/logout"><button class="logout-button" type="submit">Sign out</button></form>
      </div>
    </header>
    <section class="content">{% block content %}{% endblock %}</section>
  </main>
</div>
</body>
</html>
