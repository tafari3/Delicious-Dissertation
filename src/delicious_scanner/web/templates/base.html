<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Delicious Security{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',path='/app.css') }}"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">D</div><div><strong>Delicious Security</strong><span>Government API Assurance</span></div></div><nav><a class="{{ 'active' if page=='dashboard' else '' }}" href="/">Executive Overview</a><a class="{{ 'active' if page=='projects' else '' }}" href="/projects">Systems</a><a class="{{ 'active' if page=='scans' else '' }}" href="/">Assessments</a><a href="/docs">API</a></nav><div class="sidebar-note"><span class="status-dot"></span><div><strong>Safe Scan Mode</strong><small>Exact-host, read-only, bounded requests</small></div></div></aside><main><header class="topbar"><div><p class="eyebrow">GOVERNMENT API SECURITY ASSURANCE</p><h1>{% block heading %}Security Operations{% endblock %}</h1></div><div class="top-actions"><span class="pill">Scanner v0.2</span><span class="pill success">Protected</span><form method="post" action="/logout"><button class="logout-button" type="submit">Sign out</button></form></div></header><section class="content">{% block content %}{% endblock %}</section></main></div></body></html>
