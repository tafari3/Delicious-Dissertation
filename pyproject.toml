[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "delicious-scanner"
version = "0.1.0"
description = "Safe automated API security testing and misconfiguration scanner for dissertation research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "reportlab==4.4.3",
  "sqlalchemy==2.0.43",
  "typer==0.16.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = ["mypy==1.17.1","pytest==8.4.2","pytest-cov==6.2.1","ruff==0.12.12"]

[project.scripts]
delicious = "delicious_scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/delicious_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["delicious_scanner"]
mypy_path = "src"

[dependency-groups]
dev = [
    "types-reportlab>=5.0.0.20260911",
]

[tool.ruff.lint.per-file-ignores]
"src/delicious_scanner/api.py" = ["B008"]
"src/delicious_scanner/web/routes.py" = ["B008"]
"src/delicious_scanner/services/scanner.py" = ["E501"]
"src/delicious_scanner/services/reports.py" = ["E501"]
"migrations/versions/0002_scanning_reporting.py" = ["E501"]
